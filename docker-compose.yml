services:
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:0.11.4
    environment: [OLLAMA_HOST=http://ollama:11434]
    depends_on:
      ollama: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text:latest && ollama pull qwen2.5:1.5b && ollama list"]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${BOOK_HOST_PATH:?Set BOOK_HOST_PATH in .env}:/data/source/HPE-Bible.pdf:ro
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      ollama: {condition: service_healthy}
      ollama-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      backend: {condition: service_healthy}
    stop_grace_period: 15s

volumes:
  ollama_data:
  qdrant_data:
